name: Publier sur GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Mettre up2front.com en ligne
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le site
        uses: actions/checkout@v7

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v5
